<!DOCTYPE html>
<html lang="en">
<head>
    <title>three.js webgl - svg loader</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <link type="text/css" rel="stylesheet" href="../public/example.css">
    <style>
        body {
            background-color: #b0b0b0;
        }
    </style>
</head>
<body>
<div id="container"></div>
<div id="info">
    <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - SVGLoader
</div>


<script type="module">
    import * as THREE from "../src/Three.js";
    import {GUI} from '../libs/lil-gui.module.min.js';
    import {OrbitControls} from '../addons/controls/OrbitControls.js';
    import {SVGLoader} from '../addons/loaders/SVGLoader.js';

    let renderer, scene, camera, gui, guiData;
    init();

    //
    function init() {
        const container = document.getElementById('container');
        //
        camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 0, 200);
        //
        renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        //
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.addEventListener('change', render);
        controls.screenSpacePanning = true;
        //
        window.addEventListener('resize', onWindowResize);
        guiData = {
            currentURL: '../res/models/svg/tiger.svg',
            drawFillShapes: true,
            drawStrokes: true,
            fillShapesWireframe: false,
            strokesWireframe: false
        };
        loadSVG(guiData.currentURL);
        createGUI();
    }

    function createGUI() {
        if (gui) gui.destroy();
        gui = new GUI();
        gui.add(guiData, 'currentURL', {
            'Tiger': '../res/models/svg/tiger.svg',
            'Joins and caps': '../res/models/svg/lineJoinsAndCaps.svg',
            'Hexagon': '../res/models/svg/hexagon.svg',
            'Energy': '../res/models/svg/energy.svg',
            'Test 1': '../res/models/svg/tests/1.svg',
            'Test 2': '../res/models/svg/tests/2.svg',
            'Test 3': '../res/models/svg/tests/3.svg',
            'Test 4': '../res/models/svg/tests/4.svg',
            'Test 5': '../res/models/svg/tests/5.svg',
            'Test 6': '../res/models/svg/tests/6.svg',
            'Test 7': '../res/models/svg/tests/7.svg',
            'Test 8': '../res/models/svg/tests/8.svg',
            'Test 9': '../res/models/svg/tests/9.svg',
            'Units': '../res/models/svg/tests/units.svg',
            'Ordering': '../res/models/svg/tests/ordering.svg',
            'Defs': '../res/models/svg/tests/testDefs/Svg-defs.svg',
            'Defs2': '../res/models/svg/tests/testDefs/Svg-defs2.svg',
            'Defs3': '../res/models/svg/tests/testDefs/Wave-defs.svg',
            'Defs4': '../res/models/svg/tests/testDefs/defs4.svg',
            'Defs5': '../res/models/svg/tests/testDefs/defs5.svg',
            'Style CSS inside defs': '../res/models/svg/style-css-inside-defs.svg',
            'Multiple CSS classes': '../res/models/svg/multiple-css-classes.svg',
            'Zero Radius': '../res/models/svg/zero-radius.svg',
            'Styles in svg tag': '../res/models/svg/tests/styles.svg',
            'Round join': '../res/models/svg/tests/roundJoinPrecisionIssue.svg',
            'Ellipse Transformations': '../res/models/svg/tests/ellipseTransform.svg',
            'singlePointTest': '../res/models/svg/singlePointTest.svg',
            'singlePointTest2': '../res/models/svg/singlePointTest2.svg',
            'singlePointTest3': '../res/models/svg/singlePointTest3.svg',
            'emptyPath': '../res/models/svg/emptyPath.svg',
        }).name('SVG File').onChange(update);
        gui.add(guiData, 'drawStrokes').name('Draw strokes').onChange(update);
        gui.add(guiData, 'drawFillShapes').name('Draw fill shapes').onChange(update);
        gui.add(guiData, 'strokesWireframe').name('Wireframe strokes').onChange(update);
        gui.add(guiData, 'fillShapesWireframe').name('Wireframe fill shapes').onChange(update);

        function update() {
            loadSVG(guiData.currentURL);
        }
    }

    function loadSVG(url) {
        //
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xb0b0b0);
        //
        const helper = new THREE.GridHelper(160, 10, 0x8d8d8d, 0xc1c1c1);
        helper.rotation.x = Math.PI / 2;
        scene.add(helper);
        //
        const loader = new SVGLoader();
        loader.load(url, function (data) {
            const group = new THREE.Group();
            group.scale.multiplyScalar(0.25);
            group.position.x = -70;
            group.position.y = 70;
            group.scale.y *= -1;
            let renderOrder = 0;
            for (const path of data.paths) {
                const fillColor = path.userData.style.fill;
                if (guiData.drawFillShapes && fillColor !== undefined && fillColor !== 'none') {
                    const material = new THREE.MeshBasicMaterial({
                        color: new THREE.Color().setStyle(fillColor),
                        opacity: path.userData.style.fillOpacity,
                        transparent: true,
                        side: THREE.DoubleSide,
                        depthWrite: false,
                        wireframe: guiData.fillShapesWireframe
                    });
                    const shapes = SVGLoader.createShapes(path);
                    for (const shape of shapes) {
                        const geometry = new THREE.ShapeGeometry(shape);
                        const mesh = new THREE.Mesh(geometry, material);
                        mesh.renderOrder = renderOrder++;
                        group.add(mesh);
                    }
                }
                const strokeColor = path.userData.style.stroke;
                if (guiData.drawStrokes && strokeColor !== undefined && strokeColor !== 'none') {
                    const material = new THREE.MeshBasicMaterial({
                        color: new THREE.Color().setStyle(strokeColor),
                        opacity: path.userData.style.strokeOpacity,
                        transparent: true,
                        side: THREE.DoubleSide,
                        depthWrite: false,
                        wireframe: guiData.strokesWireframe
                    });
                    for (const subPath of path.subPaths) {
                        const geometry = SVGLoader.pointsToStroke(subPath.getPoints(), path.userData.style);
                        if (geometry) {
                            const mesh = new THREE.Mesh(geometry, material);
                            mesh.renderOrder = renderOrder++;
                            group.add(mesh);
                        }
                    }
                }
            }
            scene.add(group);
            render();
        });
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        render();
    }

    function render() {
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
